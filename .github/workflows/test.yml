name: Test

# Run the unit tests (and the undefined-name lint in pretest) on every push to
# develop, every release tag (X.Y.Z, no v prefix), every pull request, and on
# demand. The Docker integration tests (npm run test:integration) are skipped.
# Node 24 bundles npm 11, which package.json requires. No npm cache: this
# workflow also runs on release tags, where zizmor flags cache poisoning.
# The Image workflow cannot wait on this one (needs does not cross workflows),
# so check this run is green before publishing a release tag.

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build native modules
        run: npm run rebuild:natives

      - name: Test
        run: npm test
