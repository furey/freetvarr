# Example docker-compose for Freetvarr.
#
# Copy to `docker-compose.yml`, then create a `.env` file alongside it with:
#   CONFIG_PATH=/path/to/your/config          # required
#   DATA_PATH=/path/to/your/media             # required
#   PLEX_PREFS_PATH=/path/to/Plex/Preferences.xml   # optional; leave unset if no local Plex
#   TZ=Australia/Sydney                       # optional; overrides the zone chosen in Freetvarr
#   PUID=1000
#   PGID=1000
#   FREETVARR_PORT=3733
#
# CONFIG_PATH and DATA_PATH are required: compose fails fast with a message if
# either is unset, rather than silently mounting the wrong host paths. Freetvarr
# generates its CSRF secret into its config folder on first start; set
# CSRF_SECRET only to override it. TVHeadend mounts the host's /etc/localtime, so
# it follows the host clock's zone; Freetvarr asks for its zone in the setup
# wizard. Set TZ only to override both.
#
# `network_mode: host` is required on both services: network-tuner auto-discovery
# (an HDHomeRun, for example) is a UDP broadcast, which does NOT traverse
# Docker's bridge network. With
# host networking neither container has a `ports:` mapping — Freetvarr binds
# directly to ${FREETVARR_PORT} on the host LAN IP, and TVHeadend to its own
# ports (9981 HTTP, 9982 HTSP).
#
# TVHeadend mounts ${DATA_PATH}/recordings at /recordings and stores that path
# in its own database. Freetvarr mounts the whole of ${DATA_PATH} once, at
# /data, and maps /recordings/... to /data/recordings/... (TVH_RECORDINGS_PATH
# to RECORDINGS_ROOT). One mount matters: Linux refuses a hardlink between two
# bind mounts, even on one disk, so separate mounts for recordings and media
# turn every import into a full copy. Use a ${DATA_PATH} that holds only
# recordings/ and media/, because Freetvarr can write to all of it.
#
# The optional ad-removal feature (Settings → AD REMOVAL) runs comskip inside
# the Freetvarr container and is CPU-bound: expect minutes of sustained CPU
# per scanned recording. It's niced down, but budget for it on low-power hosts.

services:
  tvheadend:
    image: lscr.io/linuxserver/tvheadend:latest
    container_name: tvheadend
    restart: unless-stopped
    network_mode: host
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ
    volumes:
      - ${CONFIG_PATH:?set CONFIG_PATH in your .env}/tvheadend:/config
      - ${DATA_PATH:?set DATA_PATH in your .env}/recordings:/recordings
      - /etc/localtime:/etc/localtime:ro

  freetvarr:
    container_name: freetvarr
    image: ghcr.io/furey/freetvarr:latest
    restart: unless-stopped
    network_mode: host
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - NODE_ENV=production
      - PORT=${FREETVARR_PORT:-3733}
      - TZ
      - DB_PATH=/config/state.db
      - MEDIA_ROOT=/data/media/tv
      # Recordings with no show rule (sport, specials, films). Create the folder
      # on the host first, owned by PUID:PGID.
      - ONEOFF_ROOT=/data/media/one-offs
      - RECORDINGS_ROOT=/data/recordings
      - TVH_RECORDINGS_PATH=/recordings
      - LIVE_TV_MAX_SESSIONS=${LIVE_TV_MAX_SESSIONS:-2}
      # Minutes of live TV kept for pause and rewind (0 turns it off, max 120).
      - LIVE_TV_BUFFER_MINUTES=${LIVE_TV_BUFFER_MINUTES:-30}
      # auto (hardware if available, else software), hardware, software, or copy.
      # See docker-compose.hwaccel.example.yml to enable hardware transcoding.
      - LIVE_TV_TRANSCODE=${LIVE_TV_TRANSCODE:-auto}
      - CSRF_SECRET
      # Only set if you want the "Auto-detect from local Plex" button to work:
      - PLEX_PREFS_PATH=/plex-preferences.xml
    volumes:
      - ${CONFIG_PATH:?set CONFIG_PATH in your .env}/freetvarr:/config
      - ${DATA_PATH:?set DATA_PATH in your .env}:/data
      # Plex Preferences.xml, read-only, only for the "Auto-detect token" button.
      # Defaults to /dev/null when PLEX_PREFS_PATH is unset, so leaving it blank is
      # safe (the button just degrades). Set it only if Plex runs on this host.
      - ${PLEX_PREFS_PATH:-/dev/null}:/plex-preferences.xml:ro
    depends_on:
      - tvheadend
